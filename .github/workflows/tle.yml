# Refresh the bundled orbital elements (web/tle.txt) once a day; a change triggers the Pages deploy.
name: tle
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh web/update_tle.sh
      - run: |
          git config user.name "tle-bot"
          git config user.email "tle-bot@users.noreply.github.com"
          git add web/tle.txt
          git diff --cached --quiet || git commit -m "tle: daily refresh" && git push
