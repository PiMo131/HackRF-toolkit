# Bij elke tag v* : voortgangsrapport (PDF, huisstijl Profile Equipment) bouwen en als GitHub-release publiceren.
#   git tag -a v0.0.4 -m "..." && git push origin v0.0.4
# De inhoud komt uit docs/localisation_status.json; de PDF wordt met de Chrome van de runner gerenderd.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: versielabel voor een proefrapport (geen release)
        default: dev
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rapport renderen
        run: python3 tools/release_report.py --version "${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: rapport
          path: dist/*
      - name: Release aanmaken
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Voortgangsrapport passieve RF-lokalisatie ${{ github.ref_name }} (PDF bijgevoegd). Status en volgende stappen: STATUS.md; notities: docs/notes-*.md."
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/*.pdf --clobber      # tag opnieuw gezet: alleen de PDF vervangen
          else
            gh release create "${{ github.ref_name }}" dist/*.pdf --title "${{ github.ref_name }}" --notes "$notes" --verify-tag
          fi
